server: { http_listen_port: 9080, grpc_listen_port: 0 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: http://loki:3100/loki/api/v1/push }]
scrape_configs:
  - job_name: ascon-logs
    static_configs:
      - targets: [localhost]
        labels: { job: ascon, __path__: /logs/*.log }
  - job_name: ascon-agents
    static_configs:
      - targets: [localhost]
        # `**`: a practice period writes runs/<period>/<segment>/agents/, one level deeper than a
        # single run, and the one-level glob picked none of it up (issue #159).
        labels: { job: ascon-agents, __path__: "/runs/**/agents/*.jsonl" }
  - job_name: ascon-rpc
    static_configs:
      - targets: [localhost]
        labels: { job: ascon-rpc, __path__: /logs/rpc/*.log }
    pipeline_stages:
      - json: { expressions: { env: env } }
      - labels: { env: }
