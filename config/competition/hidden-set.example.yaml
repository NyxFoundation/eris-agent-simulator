# config/competition/hidden-set.example.yaml — the SHAPE of the hidden scenario set (rules §3.3).
#
# This file is an example, not the hidden set: these seeds are the public ones. The real hidden set
# is generated by the operator, kept out of the repository, committed to before the submission
# period opens (`npm run competition -- commit <file>` -> publish the hash, §7.1) and published in
# full after the results (§7.2). Every regime needs at least k / 8 seeds; with k = 40 that is 5.
#
# `salt` is optional and recommended: a random string that makes the commitment infeasible to
# brute-force from the seed space alone.
salt: replace-with-a-random-string
regimes:
  calm: [101, 202, 303, 404, 505]
  cex-drift: [101, 202, 303, 404, 505]
  informed-flow: [101, 202, 303, 404, 505]
  whale: [101, 202, 303, 404, 505]
  lending-incident: [101, 202, 303, 404, 505]
  crash: [101, 202, 303, 404, 505]
  depeg: [101, 202, 303, 404, 505]
  vuln: [101, 202, 303, 404, 505]
