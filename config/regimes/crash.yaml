# config/regimes/crash.yaml — official regime 6: crash event (price gap). ADR 0017 §1
#
# A seed-randomized trapezoidal crash on the same market conditions as calm, with no victims: this
# regime is about surviving and trading a price gap, not about the lending side. The liquidation wave
# lives in `lending-incident`, which is the same shock plus Aave victims.
# Run: npm run backtest -- --regime crash --seed 606 [--agents <roster>]
#
# INCOMPLETE (issue #52): the other half of this regime is the liquidity withdrawal -- LPs pulling
# depth so that the same notional costs far more slippage while the gap is open. Until that event
# type exists, every pool keeps its block-0 depth for the whole run, which makes this regime a
# "larger opportunity" regime rather than a crash: the gap grows but the cost of taking it does not.
# Read scores from it with that in mind, and re-calibrate the magnitude once #52 lands (a thinner
# book moves price further for the same flow, so the two knobs interact).
#
# There is deliberately no `run.seed` (ADR 0017 §1): the seed is supplied per scenario.
# blockTimeSec and blocks are part of the regime (ADR 0016 §3).

run:
  blocks: 360 # R: ADR 0017 §1 (crash window x3-4, ~72 LLM decisions, inside anvil's ~1050 history depth)
  seconds: 1800 # a stress run auto-disables the time limit and ends by block count (ADR 0009)
  blockTimeSec: 2
  protocols: [uniswap, balancer, curve, gmx, aave]
  economicGas: false
  localDeploy: true
  reportDir: ./runs

funding:
  wethWei: "0" # USDC-only distribution: netPnlUsdc carries β, so nobody may start already exposed (ADR 0017 §4)
  usdcUnits: "25000000000"

limits:
  agentWethWei: "1000000000000000000"
  agentUsdcUnits: "5000000000"

flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.9"
  uninformedSizeSigma: "1.0"
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"

stress:
  # Ranges, not values: the seed samples them (ADR 0009). Deeper than lending-incident's crash because
  # nothing here has to stay inside a victim's health-factor calibration.
  events:
    - {
        type: crash,
        magnitudeRange: [0.15, 0.22],
        windowFrac: [0.25, 0.7],
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 8,
      }

agents:
  - id: noop
    wallet: AGENT1_PRIVATE_KEY
    baseline: true
    description: does nothing (baseline)
  - id: venue-arb
    wallet: AGENT2_PRIVATE_KEY
    description: WETH-only cross-venue arbitrage
  - id: multi-arb
    wallet: AGENT3_PRIVATE_KEY
    description: base-agnostic cross-venue arbitrage (all active bases x all venues)
