# config/regimes/crash.yaml — official regime 6: crash event (price gap). ADR 0017 §1
#
# A seed-randomized trapezoidal crash on the same market conditions as calm, with no victims: this
# regime is about surviving and trading a price gap, not about the lending side. The liquidation wave
# lives in `lending-incident`, which is the same shock plus Aave victims.
# Run: npm run backtest -- --regime crash --seed 606 [--agents <roster>]
#
# Both halves of a crash are here (issue #52): the price gaps *and* the book thins, so the binding
# question is not "is there a gap?" but "how much of it can I actually take?". The two events share
# one window via alignWith -- a depth withdrawal somewhere else in the run would be a different
# regime, and independent draws from the same range land ~160 blocks apart in a 360-block run.
#
# Measured on the state dump (issue #52 phase 3, 50% pull, see test/liquidityPullDepth.test.ts):
# the executable price for a small trade moves <=0.1bps -- the pull is a constraint, not a free
# arbitrage -- while the cost of taking 10 WETH goes 98.6 -> 195.3bps on uniswap and balancer
# (x1.98) and 17.2 -> 71.5bps on curve (x4.15; a crypto pool's impact is far more convex).
#
# The crash magnitude below was NOT changed for it. The expectation was that a thinner book would
# make the same flow move price further, so the two magnitudes would need re-calibrating together --
# measured against a pull-free control on the same seed, the pool-fair dislocation inside the window
# went 2087 -> 2100bps, i.e. unchanged. In a 45-block run with three agents the dislocation is
# already almost entirely the crash's own; what the thin book changes is the cost of *taking* it.
# Worth re-checking at R=360 with a full roster, where more of the gap gets arbitraged away.
#
# There is deliberately no `run.seed` (ADR 0017 §1): the seed is supplied per scenario.
# blockTimeSec and blocks are part of the regime (ADR 0016 §3).

run:
  blocks: 360 # R: ADR 0017 §1 (crash window x3-4, ~72 LLM decisions, inside anvil's ~1050 history depth)
  seconds: 1800 # a stress run auto-disables the time limit and ends by block count (ADR 0009)
  blockTimeSec: 2
  protocols: [uniswap, balancer, curve, gmx, aave]
  economicGas: false
  localDeploy: true
  reportDir: ./runs

funding:
  wethWei: "0" # USDC-only distribution: netPnlUsdc carries β, so nobody may start already exposed (ADR 0017 §4)
  usdcUnits: "25000000000"

limits:
  agentWethWei: "1000000000000000000"
  agentUsdcUnits: "5000000000"

flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.9"
  uninformedSizeSigma: "1.0"
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"

stress:
  # Ranges, not values: the seed samples them (ADR 0009). Deeper than lending-incident's crash because
  # nothing here has to stay inside a victim's health-factor calibration.
  events:
    - {
        type: crash,
        magnitudeRange: [0.15, 0.22],
        windowFrac: [0.25, 0.7],
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 8,
      }
    # Depth leaves the pools while the price gaps (issue #52). The withdrawal is proportional, so the
    # mid does not move and no risk-free edge opens -- what changes is the cost of size.
    # windowFrac is still required (and still drawn) but alignWith is what places it: this event only
    # means anything on the crash's window.
    # The decay is longer than the crash's on purpose: depth comes back slower than price does, so an
    # agent that waited out the gap still trades a thinner book for a while afterwards.
    - {
        type: liquidityPull,
        magnitudeRange: [0.4, 0.6],
        windowFrac: [0.25, 0.7],
        alignWith: crash,
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 12,
      }

agents:
  - id: noop
    wallet: AGENT1_PRIVATE_KEY
    baseline: true
    description: does nothing (baseline)
  - id: venue-arb
    wallet: AGENT2_PRIVATE_KEY
    description: WETH-only cross-venue arbitrage
  - id: multi-arb
    wallet: AGENT3_PRIVATE_KEY
    description: base-agnostic cross-venue arbitrage (all active bases x all venues)
