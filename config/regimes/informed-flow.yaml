# config/regimes/informed-flow.yaml — official regime 2: correlated directional order flow.
# ADR 0017 §1
#
# What this regime tests: the market gets pushed one way, hard, for a stretch of blocks, and then
# turns. Every venue leans together, so the gap that opens is against fair rather than between
# venues -- the usual cross-venue arbitrage has much less to bite on, and the skill becomes reading
# a one-sided tape: how far the flow will run, when it turns, and whether to lean against it.
# Run: npm run backtest -- --regime informed-flow --seed 404 [--agents <roster>]
#
# The knobs that make it this regime rather than `calm`:
#
#   uninformedPersistBlocks 12   -- a venue's uninformed direction is held for 12 blocks instead of
#                                   being redrawn each block, so pressure accumulates instead of
#                                   cancelling out. 360 blocks gives ~30 direction changes.
#   uninformedTrendCorrelation 1 -- new in ADR 0017. Every venue takes the market-wide direction
#                                   rather than its own. At the default 0 the per-venue hash
#                                   deliberately splits the venues up/down to manufacture a
#                                   cross-venue spread, which is the opposite shape from this regime.
#   uninformedMax 3 WETH         -- 3x calm on uniswap. Correlated pressure only matters if it is big
#                                   enough to move the mid against the informed flow pushing back.
#
# The informed flow bot (which pulls price back toward fair) is left at calm's setting on purpose:
# it is the counterparty that makes the push finite. Raising it too would just cancel the regime out.
#
# CAVEAT, and the reason balancer/curve are NOT raised: `balancerMaxWethWei` and `curveMaxWethWei`
# are a single cap used for BOTH the uninformed and the informed leg on those venues
# (`ammMax` in core/src/flow/logic.ts maps each to `[cap, cap]`); only uniswap has separate
# `uninformedMaxWethWei` / `informedMaxWethWei`. Raising them here would have tripled the
# gap-closing flow too -- cancelling out the regime on two of three venues and leaving the venues
# with asymmetric reversion strength, which is a spurious cross-venue signal in a regime that is
# supposed to have none. So the directional push is uniswap-sized, and balancer/curve stay at calm.
#
# There is deliberately no `run.seed` (ADR 0017 §1): the seed is supplied per scenario.

run:
  blocks: 360 # R: ADR 0017 §1 (~30 direction changes at persistBlocks=12)
  seconds: 1800 # end by block count (must stay well above blocks x blockTimeSec = 720s)
  blockTimeSec: 2 # fixed to the regime (ADR 0016 §2)
  protocols: [uniswap, balancer, curve, gmx, aave]
  economicGas: false
  localDeploy: true
  reportDir: ./runs

funding:
  wethWei: "0" # USDC-only distribution: nobody starts already exposed (ADR 0017 §4)
  usdcUnits: "25000000000"

limits:
  agentWethWei: "1000000000000000000"
  agentUsdcUnits: "5000000000"

flow:
  uninformedMaxWethWei: "3000000000000000000" # 3x calm: the pressure has to be able to move the mid
  uninformedPersistBlocks: 12 # hold a direction long enough for it to accumulate
  uninformedTrendCorrelation: 1.0 # every venue leans the same way (ADR 0017 regime 2)
  informedMaxWethWei: "2000000000000000000" # unchanged: this is the force pushing back
  balancerMaxWethWei: "1000000000000000000" # one cap for both legs on this venue -- see the caveat above
  curveMaxWethWei: "1000000000000000000" # ditto
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.9"
  uninformedSizeSigma: "1.0"
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"

agents:
  - id: noop
    wallet: AGENT1_PRIVATE_KEY
    baseline: true
    description: does nothing (baseline)
  - id: venue-arb
    wallet: AGENT2_PRIVATE_KEY
    description: WETH-only cross-venue arbitrage
  - id: multi-arb
    wallet: AGENT3_PRIVATE_KEY
    description: base-agnostic cross-venue arbitrage (all active bases x all venues)
