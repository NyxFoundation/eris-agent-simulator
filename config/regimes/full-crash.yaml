# config/regimes/full-crash.yaml — the `crash` regime with every venue deployed.
#
# Derived from config/regimes/crash.yaml by adding `lst` and `liquity` to run.protocols. Nothing else
# changes: the OU parameters, the flow calibration, the stress ranges and the USDC-only funding are
# the official ones.
#
# This is a SEPARATE regime set, not the official one, and the distinction is the point (ADR 0016 §3).
# Adding the two venues changes the competition rather than merely widening it:
#   - liquity promotes eUSD into the market-priced stable set (STABLE_MARKET_LEGS), so a stable that
#     can lose its peg exists in *every* regime here, not only in depeg.
#   - a regime's liquidityPull with no `venue:` thins every enabled venue, so its meaning widens with
#     the venue set.
#   - funding stays USDC-only (ADR 0017 §4), so an LST or CDP strategy has to buy its own exposure
#     and carries the beta that USDC-denominated scoring charges for it. That is deliberate: not
#     holding something is not a reason to do nothing.
# Scores from this set are therefore not comparable with a matrix run on the official regimes.
#
# Run: npm run backtest -- --regime full-crash --seed 101 --agents <roster>
# Or as a set: npm run backtest -- --scenarios config/scenarios/full.yaml --agents <roster>

run:
  blocks: 360 # R: ADR 0017 §1 (crash window x3-4, ~72 LLM decisions, inside anvil's ~1050 history depth)
  seconds: 1800 # a stress run auto-disables the time limit and ends by block count (ADR 0009)
  blockTimeSec: 2
  protocols: [uniswap, balancer, curve, gmx, aave, lst, liquity]
  economicGas: false
  localDeploy: true
  reportDir: ./runs

funding:
  # An ETH/BTC/USDC basket rather than USDC only. The score is excess over the do-nothing
  # baseline, which holds the same funding, so the basket's beta cancels out of the metric by
  # construction (lp-provider's own comment says as much: "handed inventory is beta nobody chose
  # and it cancels out of every score because the benchmark holds it too"). What USDC-only was
  # protecting is netPnlUsdc, a reporting figure. What it cost was reachability: the LST vault and
  # the Trove are WETH/ETH denominated, and the sell side of every arbitrage had no inventory
  # behind it, so half of each strategy was structurally dead (issue #54).
  wethWei: "8000000000000000000" # 8 WETH
  base: { WBTC: "40000000" } # 0.4 WBTC (8 decimals)
  usdcUnits: "25000000000"

limits:
  agentWethWei: "1000000000000000000"
  agentUsdcUnits: "5000000000"

flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.9"
  uninformedSizeSigma: "1.0"
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"

stress:
  # Ranges, not values: the seed samples them (ADR 0009). Deeper than lending-incident's crash because
  # nothing here has to stay inside a victim's health-factor calibration.
  events:
    - {
        type: crash,
        magnitudeRange: [0.15, 0.22],
        windowFrac: [0.25, 0.7],
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 8,
      }
    # Depth leaves the pools while the price gaps (issue #52). The withdrawal is proportional, so the
    # mid does not move and no risk-free edge opens -- what changes is the cost of size.
    # windowFrac is still required (and still drawn) but alignWith is what places it: this event only
    # means anything on the crash's window.
    # The decay is longer than the crash's on purpose: depth comes back slower than price does, so an
    # agent that waited out the gap still trades a thinner book for a while afterwards.
    - {
        type: liquidityPull,
        magnitudeRange: [0.4, 0.6],
        windowFrac: [0.25, 0.7],
        alignWith: crash,
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 12,
      }

agents:
  - id: noop
    wallet: AGENT1_PRIVATE_KEY
    baseline: true
    description: does nothing (baseline)
  - id: venue-arb
    wallet: AGENT2_PRIVATE_KEY
    description: WETH-only cross-venue arbitrage
  - id: multi-arb
    wallet: AGENT3_PRIVATE_KEY
    description: base-agnostic cross-venue arbitrage (all active bases x all venues)
