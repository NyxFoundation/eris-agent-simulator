# config/regimes/metric-vuln.yaml — AUTO-GENERATED from config/regimes/vuln.yaml.
#
# Same market conditions, ADR 0019 §6 funding (1 ETH gas reserve + 100k USDC, economicGas), and
# no base inventory at all. The official regime hands out a native ETH reserve plus a WETH/WBTC
# basket: netPnlUsdc nets those out (both ends are priced at the final price) but an epoch series
# marks them live, so every agent's std_e would be the market's volatility and M9's lambda term
# would measure the market rather than the agent. Used only to compare M4 / M9 / M27 in scenario
# mode (ADR 0020 §4); the competition's own regimes are the files this was generated from.
#
# Known cost of USDC-only: lp-provider cannot mint an LP position at all (measured: 21 of 24
# rounds "insufficient LP budget"), so the one inventory-holding strategy sits the comparison out.
run:
  blocks: 360
  seconds: 1800
  blockTimeSec: 2
  protocols:
    - uniswap
    - balancer
    - curve
    - gmx
    - aave
    - lst
    - liquity
  economicGas: true
  localDeploy: true
  reportDir: ./runs
  epochBlocks: 12
  markMedianBlocks: 5
market:
  volatility: 0.004
  kappa: 0.02
funding:
  wethWei: "0"
  usdcUnits: "100000000000"
  ethWei: "1000000000000000000"
limits:
  agentWethWei: "1000000000000000000"
  agentUsdcUnits: "5000000000"
  agentBase:
    WBTC: "5000000"
flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.9"
  uninformedSizeSigma: "1.0"
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"
  baseMax:
    WBTC: "5000000"
vuln:
  poolLiquidityUsdcUnits: "2000000000000"
  poolFeeBps: 30
  llm: "0"
  events:
    - type: rigged-pool
      windowFrac:
        - 0.2
        - 0.35
      poolCount:
        - 4
        - 6
      riggedFrac:
        - 0.5
        - 0.7
      baitBps:
        - 300
        - 600
      rugBps:
        - 3000
        - 6000
      rugThresholdFrac:
        - 0.2
        - 0.4
    - type: rigged-pool
      windowFrac:
        - 0.6
        - 0.8
      poolCount:
        - 4
        - 6
      riggedFrac:
        - 0.5
        - 0.7
      baitBps:
        - 300
        - 600
      rugBps:
        - 3000
        - 6000
      rugThresholdFrac:
        - 0.2
        - 0.4
agents:
  - id: noop
    wallet: AGENT1_PRIVATE_KEY
    baseline: true
    description: does nothing (baseline)
  - id: discovery-arb
    wallet: AGENT2_PRIVATE_KEY
    description: discovers the new pools and trades the best quote immediately (the
      naive side)
  - id: discovery-arb-verify
    wallet: AGENT3_PRIVATE_KEY
    description: discovers the same pools and checks the contract before trading
      (the careful side)
  - id: venue-arb
    wallet: AGENT4_PRIVATE_KEY
    description: WETH-only cross-venue arbitrage, which never looks at a new pool at all
