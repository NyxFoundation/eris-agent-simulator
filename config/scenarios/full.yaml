# config/scenarios/full.yaml — every official regime against every seed.
#
# A scenario is (regime, seed), so this file is the cartesian product below: 7 regimes x 10 seeds =
# 70 scenarios. The regimes are the official ones (config/regimes/<name>.yaml), which since the
# five-venue set was retired means every venue is deployed.
#
# Ten seeds rather than the published five: the thing being measured is generalization across the
# distribution, and the only honest way to buy more confidence in that is more draws from it — not a
# longer run of one draw, which anvil's ~1,050-block history depth caps anyway.
#
# 70 scenarios is more than one spot box should carry: 6 regimes x 360 blocks + depeg x 120 = 2,280
# blocks per seed, and a spot interruption takes everything on the box with it. Split by *seed* so
# that a box that dies loses draws rather than regimes — each half is still a complete 7-regime
# matrix, just a smaller one:
#
#   config/scenarios/public.yaml      seeds 101-505   (also the published set)
#   config/scenarios/full-boxB.yaml   seeds 606-1010
#
# Splitting costs one thing: z-scores are computed inside a matrix, so a single ranking over both
# halves needs the two `scenarios` arrays concatenated into one matrix.json by hand (there is no
# tool; runs/matrix-metric-merged is the precedent).
#
# Run: npm run backtest -- --scenarios config/scenarios/full.yaml --agents config/rosters/full-field.yaml

regimes:
  - calm
  - cex-drift
  - informed-flow
  - whale
  - lending-incident
  - crash
  - depeg
  - vuln

seeds: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1010]
