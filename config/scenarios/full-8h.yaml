# config/scenarios/full-8h.yaml — the full-venue set sized to one box and one working day.
#
# 7 regimes x 5 seeds = 35 scenarios. Measured, not guessed: one 360-block scenario takes 795s wall
# on a c7i.4xlarge-class box (720s of block time at blockTimeSec 2, plus 75s of per-scenario setup
# and reconstruction), and depeg's 120 blocks take 315s. That is 5,085s per seed, so five seeds is
# 7.1 hours -- six would be 8.5 and miss the budget.
#
# One box on purpose. Splitting across two halves the wall clock at the same compute cost, but it
# splits matrix.json in two as well: z-scores are computed inside a matrix, so a single ranking then
# needs a manual merge (there is no tool; see runs/matrix-metric-merged for the precedent). And the
# resilience argument for splitting does not survive contact: two c7i.4xlarge spot boxes taken in
# the same region were reclaimed in the same second (2026-08-29 14:58:06Z). Losing half is also not
# the failure mode -- backtest rewrites matrix.json after every scenario, so a death at scenario 30
# still leaves 29 scored.
#
# To extend later: run config/scenarios/full-boxB.yaml (seeds 606-1010) and concatenate the
# `scenarios` arrays into one matrix.json, as runs/matrix-metric-merged did.
#
# Run: npm run backtest -- --scenarios config/scenarios/full-8h.yaml --agents config/rosters/full-field.yaml

regimes:
  - full-calm
  - full-cex-drift
  - full-informed-flow
  - full-whale
  - full-lending-incident
  - full-crash
  - full-depeg

seeds: [101, 202, 303, 404, 505]
