# config/scenarios/full.yaml — the full-venue scenario set.
#
# A scenario is (regime, seed), so this file is the cartesian product below: 7 regimes x 10 seeds =
# 70 scenarios. It is the official regime family with `lst` and `liquity` added (see any
# config/regimes/full-*.yaml header for what that changes), so its scores stand on their own and are
# not comparable with a matrix run on the official set.
#
# Ten seeds rather than the public set's five: the thing being measured is generalization across the
# distribution, and the only honest way to buy more confidence in that is more draws from it — not a
# longer run of one draw, which anvil's ~1,050-block history depth caps anyway.
#
# 70 scenarios is more than one spot box should carry: 6 regimes x 360 blocks + depeg x 120 = 2,280
# blocks per seed, and a spot interruption takes everything on the box with it. Split by *seed*
# (config/scenarios/full-boxA.yaml / full-boxB.yaml) so that a box that dies loses draws rather than
# regimes — each half is still a complete 7-regime matrix, just a smaller one.
#
# Run: npm run backtest -- --scenarios config/scenarios/full-boxA.yaml --agents config/rosters/full-field.yaml

regimes:
  - full-calm
  - full-cex-drift
  - full-informed-flow
  - full-whale
  - full-lending-incident
  - full-crash
  - full-depeg

seeds: [101, 202, 303, 404, 505]
