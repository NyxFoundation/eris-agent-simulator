# The practice devnet (ADR 0021).
#
#   npm run sim:realtime -- --config config/practice.yaml
#
# A period, not a run: the chain does not stop, participants run their own agents against it, and
# the standings are practice standings — the competition itself is scored separately, from submitted
# bundles replayed over a scenario matrix (ADR 0017 / ADR 0020).
#
# Rules §2.7 promise "a configuration equivalent to the competition environment", so the venues, the
# endowment and the flow below are the official regimes' (config/regimes/calm.yaml), and the events
# are the official regimes' episodes, every kind every day. What cannot be equivalent is the reset:
# this is one world for the whole period, so the standings rank each day's *return* rather than its
# USDC (core/src/scoring/practiceReturn.ts has why), with every day weighted the same.
#
# The seed is not the one below. Every draw in the period -- the price walk, the flow, every event
# window -- is a pure function of it, and this file is public: with `seed: 1` anyone can compute the
# block each crash lands on. The hosted period passes `--seed` from a file that is not committed
# (infra/devnet/ascon-devnet.service). `seed: 1` is what a local run of this file gets.
#
# Two things have to be true of the chain this points at, and neither is set here:
#
#   ANVIL_RPC_URL / CHAIN_ID / TREASURY_PRIVATE_KEY in .env.local. They belong to a deployment, not
#   to a config a repo commits — this file must not name one operator's node.
#
#   run.chainMode: external once that chain is a real client (issue #35's OP Stack devnet). Left at
#   the default here so the file runs against a local anvil today; flipping it turns every cheatcode
#   into a refusal with the work item that replaces it named (issue #33).
#
# Hand participants their credentials one at a time:
#   npm run manifest -- --config config/practice.yaml --participant <id> # their address (+ key)
# The manifest itself comes from the running period: the coordinator writes it into each segment and
# the dashboard serves it at <dashboard>/runs/manifest.json. It names the chain as participants reach
# it once ERIS_PUBLIC_RPC_URL is set in the box's .env.local -- not here, since this file is public
# and the rehearsal box and the hosted one publish different hosts (issue #156). By hand, the same
# file comes from `npm run manifest -- --config config/practice.yaml --public-rpc <url> --from-run
# runs/<period>`.
# A self-hosted agent runs with ERIS_CONFIG=config/practice.yaml; its run length is the manifest's.

run:
  seed: 1
  # The period ends on a date, not a block count (issue #136). Rules §2.7 end the trial on 11/30 and
  # the live week starts 12/1 (amended 2026-10-26; the date was 10/31, and the period running then was
  # extended to the new one rather than restarted -- infra/devnet/README.md "Extending a period").
  # Stated as `blocks: 1814400` (42 days) it ended 42 days after the coordinator happened to start
  # -- a start on 9/23 ran to ~11/4, into the live week -- and every restart (a restart is a new
  # competition) got a fresh 42 days. The coordinator converts this date
  # into the blocks that remain at blockTimeSec when it starts, so a restart ends on the same day.
  # It still needs a length rather than `blocks: 0`: an episode's window is placed as a fraction of
  # the run's length (ADR 0009). For a short smoke run of this file, `--blocks N` replaces the date.
  endsAt: "2026-11-30T23:59:59+09:00"
  # A ceiling, not the stop condition — a run with episodes ends on the block count so the time
  # limit cannot cut in before a window opens (ADR 0009 §4). Generous (42 days), so a chain running
  # behind cadence is not truncated.
  seconds: 3628800
  blockTimeSec: 2
  # 規約 §2.6 の確定値（docs/18 §12）。指定しないとコーディネータが既定の 30M でチェーンを
  # 上書きするので、anvil 側で 320M にしてあっても効かない。試行と本番でガス上限が違うと、
  # 参加者は本番に無いガス制約に合わせて調整することになる。
  blockGasLimit: 320000000
  protocols: [uniswap, balancer, curve, gmx, aave, lst, liquity]
  localDeploy: true
  # ADR 0011, the same as the official regimes: no priority-fee cap. Prices are storage writes and the
  # coordinator mines each block once they are in, so the environment stays first without one. The
  # gateway's own cap has to go with it: RPC_MAX_PRIORITY_FEE_WEI=0 (infra/monitoring/docker-compose.yml).
  economicGas: true
  # One world from start to finish, which is what a practice period is. The official competition
  # runs `scenario` (ADR 0020 §2), and only the matrix runner can declare it.
  resetUnit: continuous

  # The evaluation interval, stated in real time (ADR 0021 §3). Half an hour is the short end of
  # the band the ADR settles on: standings move roughly 48 times a day, which is often enough to
  # watch and rare enough that an interval is a position rather than a tick. The block count follows
  # from blockTimeSec — an operator who changes the cadence should not silently change the interval.
  # (Named `epochSeconds` before issue #140; a coordinator started on that name reads it until its
  # next restart, and the new code still accepts it with a warning.)
  #
  # The value here and the lambda that goes with it are the piece ADR 0021 leaves open (#56).
  intervalSeconds: 1800

  # One directory per day (ADR 0021 §6). The chain stays continuous; only the artifacts are cut,
  # because a week of events.jsonl is a file nobody opens.
  segmentHours: 24
  segmentName: practice
  reportDir: ./runs

  # Registrations that arrive while the period is running (ADR 0021 §2, rules §2.7). The roster
  # below is read once, at startup; this file is re-read every ~30 blocks, and each new entry is
  # funded, attributed and scored from the next round on -- without a restart, which would open a new
  # competition directory and split the standings. Same entry shape as an `external: true` + `address`
  # roster entry; see config/registrations.example.yaml. Entries already in the roster are a no-op; a
  # duplicate id or address is ignored with a `registration_ignored` event; a malformed file is
  # reported once per edit (`registrations_reload_failed`) and never stops the run.
  registrationsFile: config/registrations.yaml

# The official regimes' endowment and flow, copied rather than referenced so a change there is a
# decision here too. USDC-only was this file's earlier choice ("nothing anybody did not choose shows up
# as price drift"); it is the competition's basket now because the rules promise the same
# configuration, and because half of every strategy -- the sell side of an arbitrage, the WETH-
# denominated vault and Trove -- has nothing behind it without base inventory (issue #54). The
# basket's drift is also what the benchmark holds; on returns it is the same drift for everyone who
# kept it.
funding:
  wethWei: "8000000000000000000" # 8 WETH
  base: { WBTC: "40000000" } # 0.4 WBTC (8 decimals)
  # Gas ETH: rules §4.2 grant it on top of the basket and count it in asset value; the published
  # amount is 1 ETH. Measured spend is <= 0.005 ETH per agent per epoch, and the runtime's gas manager
  # refills from the agent's own WETH if a run ever outlasts it. (Unset, it used to be 100 ETH -- four
  # times the basket -- and that gas money's price was most of every agent's P.)
  ethWei: "1000000000000000000" # 1 ETH
  usdcUnits: "25000000000" # 25k USDC
  flowWethWei: "150000000000000000000" # 150 WETH per flow wallet (issue #112)
  flowUsdcUnits: "450000000000" # 450,000 USDC per flow wallet
  flowBase: { WBTC: "750000000" } # 7.5 WBTC (#124)

flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"
  informedArbFeeBps: 30
  uninformedArrivalRate: "0.45" # issue #79
  uninformedSizeSigma: "1.5" # issue #79
  uninformedSizeClampMult: "10" # issue #79
  gmxArrivalRate: "0.75"
  gmxSizeSigma: "1.0"
  aaveActorSizeSigma: "1.0"
  baseMax: { WBTC: "5000000" } # 0.05 BTC (8 decimals)
  baseInformedMax: { WBTC: "10000000" } # 0.1 BTC
  # Issue #130: refill every flow wallet's token that fell below half its funded amount, every 300
  # blocks (10 minutes). Funded once, a month of ~12 taker orders a block drains one side until the
  # balance guards turn the flow one-way -- a market that looks like it is trending. The official
  # regimes leave this off; their 360 blocks are calibrated on wallets funded once.
  topUpEveryBlocks: 300

# The LST's yield clock is the chain's own (lst.simulatedSecondsPerBlock defaults to blockTimeSec,
# ADR 0028), the same as the official regimes: a day of the period is a day of 3%/yr yield, ~0.8bps,
# and the vault's 50 WETH reward reserve outlasts the period at any plausible stake. Before ADR 0028
# this file set 30 s a block (issue #129: the old one-hour default drained the reserve in ~3.3 days)
# -- 15x Aave's clock, which paid ~0.12% a day for staking and looping through Aave at no risk.

# What the period contains. ADR 0021 §1 publishes the *kinds* and how many, and withholds when each
# window opens — the manifest is built from this list and carries neither the windows nor the seed
# they were drawn from.
#
# Every kind of episode the official regimes run, once a day, at the official regimes' magnitudes
# and shapes (config/regimes/{crash,spike,cex-drift,informed-flow,whale,depeg,cdp-incident}.yaml).
# The list is generated (`npm run gen:practice-episodes`, core/src/practiceEpisodes.ts has why): one
# block per 24-hour segment of the period. `windowFrac` is a fraction of the run, measured from the
# moment the coordinator starts, so the list is written for a start time -- **regenerate it right
# before every (re)start**, with that start. Where in its day each episode lands is the seed's, and
# the seed is not this file's (see the top).
#
# What the official set has and this cannot: victims (built once, at setup, and gone after the first
# crash that breaks them), a pool that appears mid-epoch (vuln), and a depeg that never comes back
# (`persist` holds to the end of the run, which here is the whole period). `repriceAnchor` is left off for
# the same reason -- in one world it compounds across every drift of the period.
