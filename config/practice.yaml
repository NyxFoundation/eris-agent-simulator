# The practice devnet (ADR 0021).
#
#   npm run sim:realtime -- --config config/practice.yaml
#
# A period, not a run: the chain does not stop, participants run their own agents against it, and
# the standings are practice standings — the competition itself is scored separately, from submitted
# bundles replayed over a scenario matrix (ADR 0017 / ADR 0020).
#
# Two things have to be true of the chain this points at, and neither is set here:
#
#   ANVIL_RPC_URL / CHAIN_ID / TREASURY_PRIVATE_KEY in .env.local. They belong to a deployment, not
#   to a config a repo commits — this file must not name one operator's node.
#
#   run.chainMode: external once that chain is a real client (issue #35's OP Stack devnet). Left at
#   the default here so the file runs against a local anvil today; flipping it turns every cheatcode
#   into a refusal with the work item that replaces it named (issue #33).
#
# Hand participants their credentials one at a time:
#   npm run manifest -- --config config/practice.yaml                    # the public manifest
#   npm run manifest -- --config config/practice.yaml --participant <id> # their address (+ key)

run:
  seed: 1
  # The period's length, in blocks. Not `blocks: 0` with a wall-clock limit, which is the shape a
  # never-ending chain suggests: an episode's window is placed as a fraction of the run's *length*
  # (ADR 0009), so a run with no block count has nowhere to put one and fails at startup. One week
  # at a two-second cadence.
  blocks: 302400
  # A ceiling, not the stop condition — a run with episodes ends on the block count so the time
  # limit cannot cut in before a window opens (ADR 0009 §4). Generous, so a chain running slightly
  # behind cadence is not truncated.
  seconds: 900000
  blockTimeSec: 2
  protocols: [uniswap, balancer, curve, lst, liquity]
  localDeploy: true
  # One world from start to finish, which is what a practice period is. The official competition
  # runs `scenario` (ADR 0020 §2), and only the matrix runner can declare it.
  resetUnit: continuous

  # A round stated in real time (ADR 0021 §3). Half an hour is the short end of the band the ADR
  # settles on: standings move roughly 48 times a day, which is often enough to watch and rare
  # enough that a round is a position rather than a tick. The block count follows from
  # blockTimeSec — an operator who changes the cadence should not silently change the round.
  #
  # The value here and the lambda that goes with it are the piece ADR 0021 leaves open (#56).
  epochSeconds: 1800

  # One directory per day (ADR 0021 §6). The chain stays continuous; only the artifacts are cut,
  # because a week of events.jsonl is a file nobody opens.
  segmentHours: 24
  segmentName: practice
  reportDir: ./runs

  # Registrations that arrive while the period is running (ADR 0021 §2, rules §2.7). The roster
  # below is read once, at startup; this file is re-read every ~30 blocks, and each new entry is
  # funded, attributed and scored from the next round on -- without a restart, which would open a new
  # competition directory and split the standings. Same entry shape as an `external: true` + `address`
  # roster entry; see config/registrations.example.yaml. Entries already in the roster are a no-op; a
  # duplicate id or address is ignored with a `registration_ignored` event; a malformed file is
  # reported once per edit (`registrations_reload_failed`) and never stops the run.
  # registrationsFile: config/registrations.yaml

funding:
  # USDC-only, so nothing anybody did not choose shows up in their score as price drift. WETH has to
  # be bought, which is what makes holding it a decision (the same argument #27 makes for a
  # market-priced stable).
  wethWei: "0"
  usdcUnits: "100000000000" # 100k USDC

flow:
  uninformedMaxWethWei: "1000000000000000000"
  informedMaxWethWei: "2000000000000000000"
  balancerMaxWethWei: "1000000000000000000"
  curveMaxWethWei: "1000000000000000000"

# What the period contains. ADR 0021 §1 publishes the *kinds* and how many, and withholds when each
# window opens — the manifest is built from this list and carries neither the windows nor the seed
# they were drawn from.
#
# `windowFrac` is a fraction of the period, so on a week-long run these land days apart.
stress:
  events:
    - {
        type: crash,
        magnitudeRange: [0.12, 0.16],
        windowFrac: [0.1, 0.25],
        rampBlocks: 3,
        holdBlocks: 6,
        decayBlocks: 8,
      }
    - {
        type: eusdDepeg,
        magnitudeRange: [0.4, 0.6],
        windowFrac: [0.35, 0.55],
        rampBlocks: 4,
        holdBlocks: 10,
        decayBlocks: 12,
      }
    - {
        type: whale,
        magnitudeRange: [8, 20],
        windowFrac: [0.6, 0.9],
      }

# The roster is a registration list, not a launch list (ADR 0021 §2).
#
#   external: true + address   the participant holds their own key. Prefer this: a key the operator
#                              generated is a key the operator has.
#   external: true + wallet    the operator issues a funded key and hands it over.
#
# `noop` is the baseline every score is measured as excess over (ADR 0019 §2) and is run by the
# operator, so it stays an ordinary entry.
# `wallet: AUTO` rather than a named dev key. On a chain the environment cannot assign balances, the
# endowment is a floor: an address that already holds something keeps it. Two agents bound to
# prefunded dev accounts once started a run with $3.0bn against a fresh address's $34k, and their
# scores were a report on one large ETH holding. The run records `initial_endowment` and warns above
# a 2x spread, but a level field starts with fresh addresses.
# `participant` is the rules §2.2 unit (a person or a team). A unit may enter two agents and is
# scored on the higher; two entries with the same `participant` are that unit's two submissions.
# Optional -- an entry without one is its own unit.
agents:
  - id: noop
    wallet: AUTO
    baseline: true
    description: does nothing — the benchmark every score is excess over
  # - id: alice
  #   external: true
  #   address: "0x..."
  #   participant: team-alice
  #   description: a registered participant
